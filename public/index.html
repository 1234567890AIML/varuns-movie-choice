<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><link rel="manifest" href="manifest.webmanifest"><title>Varun's Movie Choice</title><style>
:root{--bg:#08090d;--p:#11141b;--p2:#171b24;--line:#292f3c;--t:#f7f4ef;--m:#929bad;--o:#ff6b22;--g:#61dc91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#4b210c66,transparent 34%),var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}.top{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;padding:12px 18px;background:#08090ded;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{font:700 23px Georgia;white-space:nowrap;cursor:pointer}.logo span{color:var(--o)}.search{flex:1}.search input,.field input,.field textarea,.field select,.filter{width:100%;background:#171a22;color:#fff;border:1px solid #2c3240;border-radius:11px;padding:11px;outline:0}.btn{border:1px solid var(--line);background:#171a22;color:#fff;border-radius:11px;padding:11px 15px}.primary{background:var(--o);color:#111;border-color:var(--o);font-weight:800}.hero{min-height:540px;padding:75px 7vw 60px;display:flex;align-items:flex-end;background:linear-gradient(90deg,#08090df4,#08090da8,transparent),radial-gradient(circle at 80% 35%,#8c3b0b55,transparent 32%),linear-gradient(135deg,#111722,#261408)}.ey{color:#ff9b61;letter-spacing:.25em;font-size:11px;font-weight:900}.hero h1{font:700 clamp(52px,8vw,100px)/.87 Georgia;margin:15px 0}.hero p{max-width:650px;color:#aeb5c3;font-size:18px;line-height:1.6}.shell{padding:22px clamp(14px,4vw,55px) 90px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:22px}.nav button{border:0;background:#11141b;color:#98a0b0;border-radius:99px;padding:10px 15px;white-space:nowrap}.nav .on{color:#ff9b61;background:#ff6b2215}.kpis,.worlds{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,1fr)}.kpi,.world,.panel{background:linear-gradient(140deg,#141820,#0e1016);border:1px solid var(--line);border-radius:17px;padding:18px}.kpi strong{font-size:30px}.kpi span,.muted{display:block;color:var(--m);font-size:12px;margin-top:4px}.worlds{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.world{cursor:pointer;transition:.18s}.world:hover{transform:translateY(-3px);border-color:#596171}.world h3{margin:0 0 7px}.bar{height:5px;background:#2b303a;border-radius:99px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),#ffb26c)}.section{display:flex;justify-content:space-between;align-items:end;margin:28px 0 13px}.section h2{font:700 29px Georgia;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}.card{background:#12151c;border:1px solid #252b37;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-5px);border-color:#596171}.poster{aspect-ratio:2/3;position:relative;display:flex;align-items:end;padding:14px;background:radial-gradient(circle at 70% 15%,#ffb76b55,transparent 28%),linear-gradient(135deg,#29303d,#0b0d12);overflow:hidden}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000e)}.poster b{position:relative;z-index:1;font:700 21px/1.02 Georgia}.year{position:absolute;z-index:2;right:9px;top:9px;background:#090a0dcc;padding:5px 7px;border-radius:7px;font-size:11px}.info{padding:12px}.info h3{margin:0 0 5px;font-size:16px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{font-size:10px;color:#aeb5c3;border:1px solid #303644;padding:4px 7px;border-radius:99px}.status{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-top:9px}.watched{color:var(--g)}.want{color:#ffc16b}.modal{position:fixed;inset:0;background:#000c;z-index:50;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{width:min(950px,100%);max-height:94vh;overflow:auto;background:#11141b;border:1px solid #353b48;border-radius:20px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:#9ba3b2;font-weight:800}.wide{grid-column:1/-1}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.mobile{display:none}@media(max-width:800px){.top .btn{display:none}.logo{font-size:18px}.hero{min-height:500px;padding:60px 22px 45px}.hero h1{font-size:55px}.shell{padding:18px 13px 90px}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.poster b{font-size:17px}.nav{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0b0d12ee;backdrop-filter:blur(18px);border-top:1px solid var(--line);justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.mobile button{border:0;background:none;color:#a1a9b8;padding:9px;font-size:11px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div id="root"></div><div id="modal" class="modal"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './supabase-config.js';const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const LANGS=['Telugu','Hindi','Tamil','Malayalam','Kannada','Bengali','Marathi','English','Korean','Japanese','Spanish','French','Iranian/Persian','Other'];const GENRES=['Thriller','Horror','Psychological','Mystery','Crime','Action','Romance','Comedy','Drama','Sci-Fi','Fantasy','Survival','Historical','Animation','Experimental'];let user=null,movies=[],seed=[],seedLoaded=false,view='home',q='',L='All',G='All',S='All';
const people=['Mahesh Babu','Venkatesh','Allu Arjun','Ram Charan','Chiranjeevi','Pawan Kalyan','Nani','Jr NTR','Prabhas','Sumanth','S.S. Rajamouli','Puri Jagannadh','Navdeep','Trivikram Srinivas','Sukumar','Kajal Aggarwal','Tamannaah Bhatia','Samantha Ruth Prabhu','Vijay','Suriya','Nagarjuna','Shah Rukh Khan','Ranbir Kapoor','Sushanth','Sanjay Leela Bhansali','Venky Atluri','Mani Ratnam','Rajinikanth','Rakul Preet Singh','Kiran Abbavaram','Vijay Deverakonda','Sandeep Reddy Vanga','Ranveer Singh','Deepika Padukone','Hrithik Roshan','Sharwanand','Raghava Lawrence','Mamitha Baiju','Naslen','Fahadh Faasil','Dulquer Salmaan','Rana Daggubati','Nivin Pauly','Naveen Polishetty','Adivi Sesh','Anushka Shetty','Lokesh Kanagaraj','Atlee','Christopher Nolan'];
function nav(){return `<div class="nav">${[['home','⌂ Home'],['world','◈ Movie World'],['movies','▣ Movies'],['stats','◉ Stats']].map(a=>`<button class="${view===a[0]?'on':''}" onclick="go('${a[0]}')">${a[1]}</button>`).join('')}</div><div class="mobile"><button onclick="go('home')">⌂<br>Home</button><button onclick="go('world')">◈<br>World</button><button onclick="add()">＋<br>Add</button><button onclick="go('movies')">▣<br>Movies</button><button onclick="go('stats')">◉<br>Stats</button></div>`}function header(){return `<header class="top"><div class="logo" onclick="go('home')">Varun's <span>Movie Choice</span></div><div class="search"><input value="${esc(q)}" placeholder="Search movies, actors, directors, genres..." oninput="q=this.value;render()"></div><button class="btn primary" onclick="add()">＋ Add movie</button></header>`}
function card(m){return `<article class="card" onclick="edit('${m.id}')"><div class="poster">${m.signature_photo_url?`<img src="${esc(m.signature_photo_url)}">`:''}<span class="year">${m.year||''}</span><b>${esc(m.title)}</b></div><div class="info"><h3>${esc(m.title)}</h3><div class="muted">${esc(m.language)} · ${esc(m.director||'Director not added')}</div><div class="chips">${(m.genres||[]).slice(0,2).map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div><div class="status ${m.status==='Watched'||m.status==='Rewatching'?'watched':'want'}">${esc(m.status)}${m.rating!=null?' · ★ '+m.rating:''}</div></div></article>`}
function normLang(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,' ')}
function normTitle(v){return String(v??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function sameLang(a,b){return normLang(a)===normLang(b)}
function list(){let a=movies.filter(m=>(L==='All'||sameLang(m.language,L))&&(G==='All'||(m.genres||[]).some(x=>normLang(x).includes(normLang(G))))&&(S==='All'||m.status===S));if(q){let z=q.toLowerCase().trim();a=a.filter(m=>(m.title+' '+m.language+' '+m.year+' '+(m.director||'')+' '+(m.cast_members||[]).join(' ')+' '+(m.genres||[]).join(' ')+' '+(m.tags||[]).join(' ')).toLowerCase().includes(z))}return a.sort((a,b)=>(b.year||0)-(a.year||0))}
function home(){let w=movies.filter(m=>['Watched','Rewatching'].includes(m.status)).length,r=movies.filter(m=>m.rating!=null),avg=r.length?(r.reduce((a,m)=>a+Number(m.rating),0)/r.length).toFixed(1):'—';return `<section class="hero"><div><div class="ey">A PERSONAL CINEMA ARCHIVE</div><h1>VARUN'S<br>MOVIE WORLD</h1><p>Your films, memories and ratings, living together in one private cinema archive.</p><div class="actions"><button class="btn primary" onclick="go('world')">Enter the Movie World ↗</button><button class="btn" onclick="add()">＋ Log a movie</button></div></div></section><div class="shell">${nav()}<div class="kpis"><div class="kpi"><strong>${movies.length}</strong><span>Films</span></div><div class="kpi"><strong>${w}</strong><span>Watched</span></div><div class="kpi"><strong>${movies.length-w}</strong><span>To explore</span></div><div class="kpi"><strong>${avg}</strong><span>Your average</span></div></div><div class="section"><h2>Movie World</h2></div><div class="worlds">${LANGS.map(l=>{let n=movies.filter(m=>sameLang(m.language,l)).length,w=movies.filter(m=>sameLang(m.language,l)&&['Watched','Rewatching'].includes(m.status)).length;return `<div class="world" onclick="selectLanguage('${l}')"><h3>${l}</h3><div class="muted">${w} watched · ${n} films</div><div class="bar"><i style="width:${n?Math.round(w/n*100):0}%"></i></div></div>`}).join('')}</div><div class="section"><h2>Archive</h2><button class="btn" onclick="go('movies')">See all →</button></div><div class="grid">${movies.slice(0,8).map(card).join('')||'<div class="panel">Your archive is empty.</div>'}</div><div class="panel" style="margin-top:22px"><h3>Load your starter catalogue</h3><p class="muted">${seedLoaded?`Starter file ready: ${seed.length} records.`:'Starter catalogue is ready to import from the bundled seed file.'} Your ratings remain blank.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="loadStarter()">＋ Load starter catalogue</button><button class="btn" onclick="repairLanguages()">↻ Repair language data</button></div></div></div>`}
function world(){return `<div class="shell">${nav()}<div class="section"><h2>Movie World</h2></div><div class="worlds">${LANGS.map(l=>`<div class="world" onclick="selectLanguage('${l}')"><h3>${l}</h3><div class="muted">${movies.filter(m=>sameLang(m.language,l)).length} films</div></div>`).join('')}</div><div class="section"><h2>Genres</h2></div><div class="worlds">${GENRES.map(g=>`<div class="world" onclick="G='${g}';go('movies')"><h3>${g}</h3><div class="muted">${movies.filter(m=>(m.genres||[]).some(x=>x.toLowerCase().includes(g.toLowerCase()))).length} films</div></div>`).join('')}</div></div>`}
function moviesPage(){let a=list();return `<div class="shell">${nav()}<div class="section"><div><h2>${L==='All'?'All Movies':esc(L)+' Movies'}</h2><div class="muted">${a.length} films</div></div><button class="btn primary" onclick="add()">＋ Add movie</button></div><div class="panel" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="muted" style="display:inline-block;margin:0">Filters:</span><select class="filter" style="width:auto" onchange="L=this.value;render()"><option>All</option>${LANGS.map(x=>`<option ${x===L?'selected':''}>${x}</option>`).join('')}</select><select class="filter" style="width:auto" onchange="G=this.value;render()"><option>All</option>${GENRES.map(x=>`<option ${x===G?'selected':''}>${x}</option>`).join('')}</select><select class="filter" style="width:auto" onchange="S=this.value;render()"><option>All</option>${['Want to Watch','Watching','Watched','Rewatching','Dropped'].map(x=>`<option ${x===S?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="clearFilters()">Clear filters</button></div><div class="muted" style="margin:10px 0">Showing: ${L==='All'?'All languages':esc(L)}${G!=='All'?' · '+esc(G):''}${S!=='All'?' · '+esc(S):''}</div><div style="height:8px"></div><div class="grid">${a.map(card).join('')||'<div class="panel">No movies match.</div>'}</div></div>`}
function stats(){let w=movies.filter(m=>['Watched','Rewatching'].includes(m.status)),r=movies.filter(m=>m.rating!=null);return `<div class="shell">${nav()}<div class="section"><h2>Your Cinema Stats</h2></div><div class="kpis"><div class="kpi"><strong>${movies.length}</strong><span>Total films</span></div><div class="kpi"><strong>${w.length}</strong><span>Watched</span></div><div class="kpi"><strong>${r.length}</strong><span>Rated</span></div><div class="kpi"><strong>${r.length?(r.reduce((a,m)=>a+Number(m.rating),0)/r.length).toFixed(1):'—'}</strong><span>Average rating</span></div></div></div>`}
window.selectLanguage=l=>{L=l;G='All';S='All';q='';view='movies';render();scrollTo(0,0)};
window.clearFilters=()=>{L='All';G='All';S='All';q='';render()};
window.repairLanguages=async()=>{if(!user)return login();const loaded=await loadSeed();if(!loaded.ok)return alert('Could not load seed.json: '+loaded.error.message);const byKey=new Map(seed.map(x=>[normTitle(x.title)+'|'+String(x.year||''),x.language||'Other']));let changed=0,checked=0;for(const m of movies){const lang=byKey.get(normTitle(m.title)+'|'+String(m.year||''));if(lang && normLang(m.language)!==normLang(lang)){const {error}=await db.from('movies').update({language:lang}).eq('id',m.id).eq('user_id',user.id);if(error)return alert('Repair stopped after '+changed+' fixes: '+error.message);changed++;}checked++;}alert(`Language repair complete.\n\nChecked ${checked} movies.\nFixed ${changed} language values.\n\nNow open Movie World and choose a language.`);await start()};
function render(){root.innerHTML=header()+(view==='home'?home():view==='world'?world():view==='stats'?stats():moviesPage())}window.go=v=>{view=v;render();scrollTo(0,0)};
async function loadSeed(){
  if(seedLoaded && seed.length) return {ok:true};
  try{
    const r=await fetch('./seed.json?catalog=v4',{cache:'no-store'});
    if(!r.ok) throw new Error('seed.json returned '+r.status);
    const data=await r.json();
    if(!Array.isArray(data) || !data.length) throw new Error('seed.json is empty or invalid');
    seed=data; seedLoaded=true; return {ok:true};
  }catch(e){
    seed=[]; seedLoaded=false; return {ok:false,error:e};
  }
}
async function start(){let {data:s}=await db.auth.getSession();user=s.session?.user;if(!user){login();return}await loadSeed();let {data,error}=await db.from('movies').select('*').order('year',{ascending:false});if(error){root.innerHTML=`<div class="shell"><div class="panel"><h2>Database error</h2><p>${esc(error.message)}</p></div></div>`;return}movies=data||[];render()}function login(){root.innerHTML=`<section class="hero"><div><div class="ey">YOUR PERSONAL CINEMA ARCHIVE</div><h1>VARUN'S<br>MOVIE CHOICE</h1><p>One private movie universe. Available everywhere.</p><div class="panel"><h2>Enter your movie world</h2><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><br><button class="btn primary" onclick="signin()">Send magic link</button></div></div></section>`}window.signin=async()=>{let e=$('email').value.trim();let {error}=await db.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});alert(error?'Error: '+error.message:'Check your email.')};
window.loadStarter=async()=>{
  if(!user) return login();
  const loaded=await loadSeed();
  if(!loaded.ok) return alert('I could not load the starter catalogue file. Please redeploy the latest files to Cloudflare so seed.json is included.\n\nDetails: '+loaded.error.message);
  if(!seed.length) return alert('Starter catalogue is empty.');
  if(!confirm(`Load ${seed.length} starter records into your private archive? Existing movies stay untouched and ratings remain blank.`)) return;
  const {data:existing,error:readError}=await db.from('movies').select('title,year').eq('user_id',user.id);
  if(readError) return alert('Could not read your existing movies: '+readError.message);
  const keys=new Set((existing||[]).map(x=>String(x.title||'').trim().toLowerCase()+'|'+String(x.year||'')));
  const rows=seed.filter(m=>!keys.has(String(m.title||'').trim().toLowerCase()+'|'+String(m.year||''))).map(m=>({
    user_id:user.id,title:m.title,year:m.year||null,language:m.language||'Other',genres:m.genre?[m.genre]:[],
    status:['Want to Watch','Watching','Watched','Rewatching','Dropped'].includes(m.watched)?m.watched:'Want to Watch',
    rating:null,director:m.director||'',cast_members:Array.isArray(m.cast)?m.cast:String(m.cast||'').split(',').map(x=>x.trim()).filter(Boolean),
    storyline:m.story||'',liked_most:m.like||'',opinion:m.opinion||'',favourite_scene:m.fav||'',rewatch_count:0,tags:[],notes:''
  }));
  if(!rows.length) return alert('Your starter catalogue is already loaded. Nothing new to import.');
  let done=0;
  for(let i=0;i<rows.length;i+=50){
    const {error}=await db.from('movies').insert(rows.slice(i,i+50));
    if(error) return alert(`Import stopped after ${done} movies.\n\n${error.message}`);
    done=Math.min(i+50,rows.length);
  }
  let peopleAdded=0;
  for(const p of people){
    const {data:f}=await db.from('custom_people').select('id').eq('user_id',user.id).eq('name',p).maybeSingle();
    if(!f){const {error}=await db.from('custom_people').insert({user_id:user.id,name:p}); if(!error) peopleAdded++;}
  }
  alert(`Catalogue loaded successfully.\n\n${done} movies added${peopleAdded?` and ${peopleAdded} people added`:''}.\nYour ratings were left blank.`);
  await start();
};
window.add=()=>edit({title:'',year:new Date().getFullYear(),language:'Telugu',genres:['Drama'],status:'Want to Watch',rating:null,cast_members:[],director:'',date_watched:null,rewatch_count:0,liked_most:'',opinion:'',favourite_scene:'',notes:'',storyline:'',tags:[],signature_photo_url:''},true);window.edit=async id=>{let m=movies.find(x=>x.id===id);editForm(m,false)};
function editForm(m,isNew){$('modal').innerHTML=`<div class="sheet"><div style="display:flex;justify-content:space-between"><h2>${isNew?'Add movie':'Edit movie'}</h2><button class="btn" onclick="closeM()">✕</button></div><div class="form"><div class="field"><label>Title *</label><input id="t" value="${esc(m.title)}"></div><div class="field"><label>Year</label><input id="y" type="number" value="${m.year||''}"></div><div class="field"><label>Language</label><select id="l">${LANGS.map(x=>`<option ${x===m.language?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="s">${['Want to Watch','Watching','Watched','Rewatching','Dropped'].map(x=>`<option ${x===m.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Genres</label><input id="g" value="${esc((m.genres||[]).join(', '))}"></div><div class="field"><label>Director</label><input id="d" value="${esc(m.director||'')}"></div><div class="field wide"><label>Cast</label><input id="c" value="${esc((m.cast_members||[]).join(', '))}"></div><div class="field"><label>Your rating / 10</label><input id="r" type="number" min="0" max="10" step=".1" value="${m.rating??''}" placeholder="Leave blank"></div><div class="field"><label>Date watched</label><input id="date" type="date" value="${m.date_watched||''}"></div><div class="field"><label>Rewatch count</label><input id="rw" type="number" min="0" value="${m.rewatch_count||0}"></div><div class="field"><label>Signature photo</label><input id="photo" type="file" accept="image/*"></div><div class="field wide"><label>Storyline</label><textarea id="story">${esc(m.storyline||'')}</textarea></div><div class="field"><label>What did I like most?</label><textarea id="like">${esc(m.liked_most||'')}</textarea></div><div class="field"><label>My opinion</label><textarea id="op">${esc(m.opinion||'')}</textarea></div><div class="field"><label>Favourite scene</label><textarea id="fav">${esc(m.favourite_scene||'')}</textarea></div><div class="field"><label>Tags</label><input id="tags" value="${esc((m.tags||[]).join(', '))}"></div><div class="field wide"><label>Notes</label><textarea id="notes">${esc(m.notes||'')}</textarea></div></div><div class="foot"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="saveM('${m.id||''}',${isNew})">Save movie</button></div></div>`;$('modal').classList.add('show')}
window.closeM=()=>modal.classList.remove('show');window.saveM=async(id,isNew)=>{let title=$('t').value.trim();if(!title)return alert('Title required');let m={user_id:user.id,title,year:+$('y').value,language:$('l').value,status:$('s').value,genres:$('g').value.split(',').map(x=>x.trim()).filter(Boolean),director:$('d').value,cast_members:$('c').value.split(',').map(x=>x.trim()).filter(Boolean),rating:$('r').value===''?null:+$('r').value,date_watched:$('date').value||null,rewatch_count:+$('rw').value||0,storyline:$('story').value,liked_most:$('like').value,opinion:$('op').value,favourite_scene:$('fav').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),notes:$('notes').value};let f=$('photo').files[0];if(f){let path=user.id+'/'+(id||crypto.randomUUID())+'.jpg';let {error}=await db.storage.from('movie-signatures').upload(path,f,{upsert:true,contentType:f.type});if(error)return alert(error.message);m.signature_photo_url=db.storage.from('movie-signatures').getPublicUrl(path).data.publicUrl}let res=isNew?await db.from('movies').insert(m):await db.from('movies').update(m).eq('id',id).eq('user_id',user.id);if(res.error)return alert(res.error.message);closeM();start()};if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}start();</script></body></html>
